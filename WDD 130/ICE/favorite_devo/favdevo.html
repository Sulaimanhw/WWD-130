<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Favorite Devotionals</title>
  <link rel="stylesheet" href="styles/styles.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-image">
        <h1>My Favorite<br>Devotionals</h1>
      </div>
    </header>
    <main>

      <div class="content-box">

        <table class="devo-table">
            <thead>
                <tr>
                    <th>Speaker</th>
                    <th>Title</th>
                    <th>Location</th>
                    <th>Year</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>David A. Bednar</td>
                    <td>Bear Up Their Burdens with Ease</td>
                    <td>BYU Devotional</td>
                    <td>2014</td>
                </tr>
                <tr>
                    <td>Jeffrey R. Holland</td>
                    <td>Cast Not Away Therefore Your Confidence</td>
                    <td>BYU Devotional</td>
                    <td>1999</td>
                </tr>
                <tr>
                    <td>Dieter F. Uchtdorf</td>
                    <td>Your Great Adventure</td>
                    <td>BYU Devotional</td>
                    <td>2019</td>
                </tr>
            </tbody>
        </table>

        <h2>Add a New Devotional</h2>

        <form class="devo-form">
            <label for="speaker">
                Speaker <span class="required">*</span>
            </label>
            <input type="text" id="speaker" name="speaker" placeholder="Enter speaker name" required>

            <label for="title">
                Title <span class="required">*</span>
            </label>
            <input type="text" id="title" name="title" placeholder="Enter devotional title" required>

            <label for="location">
                Location <span class="required">*</span>
            </label>
            <input type="text" id="location" name="location" placeholder="Enter location" required>

            <label for="year">
                Year <span class="required">*</span>
            </label>
            <input type="number" id="year" name="year" placeholder="Enter year" required>

            <button type="submit">Add Devotional</button>
        </form>

        <h3><span class="required">*</span> required field</h3>

      </div>
      
    </main>
  </div>
</body>
</html>
