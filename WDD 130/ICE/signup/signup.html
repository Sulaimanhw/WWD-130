<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
        }

        body {
            background: rgb(120, 96, 64);
        }
        #formContainer {
            width: 400px;
            margin: 50px auto; 
            background: rgb(255, 255, 255);
            position: relative;
            border: 10px solid #1424d1;
            border-radius: 50px;
            overflow: hidden;
        }
        #closeBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            border-radius: 2px;
            border: none;
            background-color: #e0e0e0;
        }
        #closeBtn:hover {
            background-color: rgb(153, 155, 165);
        }
        #myForm {
            display: grid; 
            grid-template-columns: 1fr;
            grid-template-columns: 1fr 1fr;
            gap: 10px; 
            background: rgb(255, 255, 255);
            padding: 30px;
        }
        #header {
            background-image: url('images/jesus_feeds_5000.jpeg');
            background-size: cover;
            height: 150px;
            display: grid;
            grid-template-rows: 1fr 1fr 1fr 1fr;
            text-align: center;
        }
        h1 {
            font-family: 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
            font-size: 2rem;
            color: white;
            grid-row: 3/4;
            padding: auto;
            color: white;
            font-weight: bold;
            text-shadow:  
                    2px 2px 0px #000,
                    6px 6px 10px rgba(0, 0, 0, 0.6);
        }
        h3 {
            text-align: center;
            margin-top: 20px;
        }
        p {
            font-family:  serif;
            font-size: 1.7rem;
            color: white;
            grid-row: 4/5;
            text-shadow: 2px 2px 5px black;
            text-shadow:  
                    2px 2px 0px #000,
                    6px 6px 10px rgba(0, 0, 0, 0.6);
            margin-bottom: 20px;
        }
        #myForm section {
            grid-column: span 2;
            text-align: center;
            margin: 5px;
        }
        #img_holder {
            width: 400px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1px;
        }
        #img_holder img {
            width: 100%;
            height: 100px;
        }
        .style_label, .style_input {
            display: block;
            margin-bottom: 10px;
        }
        .style_input {
            width: 100%;
            border: 1px solid rgb(153, 153, 153);
            border-radius: 2px;
        }
        #submitBtn {
            background-color: #e0e0e0;
            border: 1px solid rgb(153, 153, 153);
            padding: 1px 10px;
            border-radius: 2px;
        }
        #submitBtn:hover {
            background-color: rgb(153, 155, 165);
        }
    </style>




</head>

<body>
    <div id="formContainer">
            <button type="button" id="closeBtn">X</button>
        <div id="header" >
        <h1>Daily Feed</h1>
        <p>Scripture a Day</p>
        </div>
        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label class="style_label" for="username">User Name:</label>
            <input class="style_input" type="text" id="username" name="username" required>

            <label class="style_label" for="password">Password:</label>
            <input class="style_input" type="password" id="password" name="password" required>

            <label class="style_label" for="email">Email:</label>
            <input class="style_input" type="email" id="email" name="email" required>

            <label >Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button id="submitBtn" type="submit">Submit</button>
            </section>
        </form>
        <div id="img_holder">  
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
